<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Momo QR Payment</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --momo-primary: #a50064;
            --momo-secondary: #d82d8b;
            --momo-gradient: linear-gradient(135deg, #a50064 0%, #d82d8b 100%);
            --momo-light: #fce4ec;
            --success-color: #4caf50;
            --danger-color: #f44336;
            --text-primary: #333;
            --text-secondary: #666;
            --bg-color: #f5f5f5;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--white);
            display: flex;
            flex-direction: column;
        }
        .header {
            background: var(--momo-gradient);
            padding: 20px;
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--white);
            padding: 4px;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .main-content { flex: 1; padding: 20px; }
        .payment-form {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--bg-color);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--momo-primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(165, 0, 100, 0.1);
        }
        .form-group input::placeholder { color: #aaa; }
        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: var(--momo-gradient);
            color: var(--white);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-primary);
            margin-top: 16px;
        }
        .btn-success { background: var(--success-color); color: var(--white); flex: 1; }
        .btn-danger { background: var(--danger-color); color: var(--white); flex: 1; }
        .btn-group { display: flex; gap: 12px; }
        .qr-section { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .qr-card {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .qr-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--momo-primary);
            font-weight: 600;
        }
        .qr-logo { width: 32px; height: 32px; }
        .qr-code-wrapper {
            background: var(--white);
            padding: 20px;
            border-radius: 16px;
            display: inline-block;
            border: 3px solid var(--momo-light);
            margin-bottom: 20px;
        }
        #qrCode { display: flex; justify-content: center; align-items: center; }
        #qrCode img { border-radius: 8px; }
        .payment-info {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: var(--text-secondary); font-size: 14px; }
        .info-row .value {
            font-weight: 500;
            font-size: 14px;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        .amount-row .value {
            color: var(--momo-primary);
            font-size: 18px;
            font-weight: 700;
        }
        .status-section { margin-bottom: 20px; }
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border-radius: 12px;
            background: var(--momo-light);
        }
        .status-icon { font-size: 24px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .status-indicator.success { background: #e8f5e9; }
        .status-indicator.success .status-icon { color: var(--success-color); animation: none; }
        .status-indicator.failed { background: #ffebee; }
        .status-indicator.failed .status-icon { color: var(--danger-color); animation: none; }
        .status-text { font-weight: 500; color: var(--text-primary); }
        .test-buttons {
            margin-bottom: 16px;
            padding: 16px;
            background: #fff9c4;
            border-radius: 12px;
        }
        .test-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-align: center;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-content {
            background: var(--white);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            animation: scaleIn 0.3s ease;
        }
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }
        .modal-content.success .modal-icon { background: #e8f5e9; color: var(--success-color); }
        .modal-content.failed .modal-icon { background: #ffebee; color: var(--danger-color); }
        .modal-content h2 { font-size: 22px; margin-bottom: 16px; }
        .modal-content.success h2 { color: var(--success-color); }
        .modal-content.failed h2 { color: var(--danger-color); }
        .modal-amount {
            font-size: 28px;
            font-weight: 700;
            color: var(--momo-primary);
            margin-bottom: 8px;
        }
        .modal-desc, .modal-message {
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .footer {
            text-align: center;
            padding: 16px;
            color: var(--text-secondary);
            font-size: 12px;
            border-top: 1px solid #eee;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <img src="https://upload.wikimedia.org/wikipedia/vi/f/fe/MoMo_Logo.png" alt="Momo" class="logo">
                <h1>Thanh toán QR</h1>
            </div>
        </header>

        <main class="main-content">
            <section class="payment-form" id="paymentForm">
                <div class="form-group">
                    <label for="phoneNumber">Số điện thoại nhận tiền</label>
                    <input type="tel" id="phoneNumber" placeholder="VD: 0912345678" maxlength="10">
                </div>
                <div class="form-group">
                    <label for="receiverName">Tên người nhận</label>
                    <input type="text" id="receiverName" placeholder="VD: NGUYEN VAN A">
                </div>
                <div class="form-group">
                    <label for="amount">Số tiền (VNĐ)</label>
                    <input type="text" id="amount" placeholder="VD: 50000" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label for="description">Nội dung chuyển tiền</label>
                    <input type="text" id="description" placeholder="VD: Thanh toan don hang">
                </div>
                <button class="btn btn-primary" id="generateQR">
                    <span>📱</span> Tạo mã QR
                </button>
            </section>

            <section class="qr-section hidden" id="qrSection">
                <div class="qr-card">
                    <div class="qr-header">
                        <img src="https://upload.wikimedia.org/wikipedia/vi/f/fe/MoMo_Logo.png" alt="Momo" class="qr-logo">
                        <span>Quét mã để thanh toán</span>
                    </div>
                    <div class="qr-code-wrapper">
                        <div id="qrCode"></div>
                    </div>
                    <div class="payment-info">
                        <div class="info-row">
                            <span class="label">Người nhận:</span>
                            <span class="value" id="displayName">-</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Số điện thoại:</span>
                            <span class="value" id="displayPhone">-</span>
                        </div>
                        <div class="info-row amount-row">
                            <span class="label">Số tiền:</span>
                            <span class="value amount" id="displayAmount">-</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Nội dung:</span>
                            <span class="value" id="displayDescription">-</span>
                        </div>
                    </div>
                    <div class="status-section" id="statusSection">
                        <div class="status-indicator" id="statusIndicator">
                            <div class="status-icon pending">⏳</div>
                            <span class="status-text">Đang chờ thanh toán...</span>
                        </div>
                    </div>
                    <div class="test-buttons">
                        <p class="test-label">Mô phỏng kết quả:</p>
                        <div class="btn-group">
                            <button class="btn btn-success" id="btnSuccess">✓ Thành công</button>
                            <button class="btn btn-danger" id="btnFailed">✗ Thất bại</button>
                        </div>
                    </div>
                    <button class="btn btn-secondary" id="newPayment">Tạo thanh toán mới</button>
                </div>
            </section>

            <div class="modal hidden" id="successModal">
                <div class="modal-content success">
                    <div class="modal-icon">✓</div>
                    <h2>Thanh toán thành công!</h2>
                    <p class="modal-amount" id="successAmount">0 đ</p>
                    <p class="modal-desc" id="successDesc">-</p>
                    <button class="btn btn-primary" id="closeSuccess">Đóng</button>
                </div>
            </div>

            <div class="modal hidden" id="failedModal">
                <div class="modal-content failed">
                    <div class="modal-icon">✗</div>
                    <h2>Thanh toán thất bại!</h2>
                    <p class="modal-message">Giao dịch không thể hoàn tất. Vui lòng thử lại.</p>
                    <button class="btn btn-primary" id="closeFailed">Thử lại</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Demo thanh toán QR Momo</p>
        </footer>
    </div>

    <script>
        class MomoPayment {
            constructor() {
                this.qrCodeInstance = null;
                this.currentPayment = null;
                this.init();
            }

            init() {
                this.bindElements();
                this.bindEvents();
                this.formatAmountInput();
            }

            bindElements() {
                this.phoneInput = document.getElementById('phoneNumber');
                this.nameInput = document.getElementById('receiverName');
                this.amountInput = document.getElementById('amount');
                this.descriptionInput = document.getElementById('description');
                this.generateBtn = document.getElementById('generateQR');
                this.paymentForm = document.getElementById('paymentForm');
                this.qrSection = document.getElementById('qrSection');
                this.qrCodeContainer = document.getElementById('qrCode');
                this.displayName = document.getElementById('displayName');
                this.displayPhone = document.getElementById('displayPhone');
                this.displayAmount = document.getElementById('displayAmount');
                this.displayDescription = document.getElementById('displayDescription');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.btnSuccess = document.getElementById('btnSuccess');
                this.btnFailed = document.getElementById('btnFailed');
                this.newPaymentBtn = document.getElementById('newPayment');
                this.successModal = document.getElementById('successModal');
                this.failedModal = document.getElementById('failedModal');
                this.successAmount = document.getElementById('successAmount');
                this.successDesc = document.getElementById('successDesc');
                this.closeSuccessBtn = document.getElementById('closeSuccess');
                this.closeFailedBtn = document.getElementById('closeFailed');
            }

            bindEvents() {
                this.generateBtn.addEventListener('click', () => this.generateQRCode());
                this.btnSuccess.addEventListener('click', () => this.simulateSuccess());
                this.btnFailed.addEventListener('click', () => this.simulateFailed());
                this.newPaymentBtn.addEventListener('click', () => this.resetForm());
                this.closeSuccessBtn.addEventListener('click', () => this.closeModal('success'));
                this.closeFailedBtn.addEventListener('click', () => this.closeModal('failed'));
                this.successModal.addEventListener('click', (e) => {
                    if (e.target === this.successModal) this.closeModal('success');
                });
                this.failedModal.addEventListener('click', (e) => {
                    if (e.target === this.failedModal) this.closeModal('failed');
                });
                [this.phoneInput, this.nameInput, this.amountInput, this.descriptionInput].forEach(input => {
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') this.generateQRCode();
                    });
                });
            }

            formatAmountInput() {
                this.amountInput.addEventListener('input', (e) => {
                    let value = e.target.value.replace(/\D/g, '');
                    e.target.value = value;
                });
            }

            validateForm() {
                const phone = this.phoneInput.value.trim();
                const name = this.nameInput.value.trim();
                const amount = this.amountInput.value.trim();
                if (!phone || phone.length < 10) {
                    alert('Vui lòng nhập số điện thoại hợp lệ (10 số)');
                    this.phoneInput.focus();
                    return false;
                }
                if (!name) {
                    alert('Vui lòng nhập tên người nhận');
                    this.nameInput.focus();
                    return false;
                }
                if (!amount || parseInt(amount) < 1000) {
                    alert('Số tiền tối thiểu là 1,000 VNĐ');
                    this.amountInput.focus();
                    return false;
                }
                return true;
            }

            generateQRCode() {
                if (!this.validateForm()) return;
                const phone = this.phoneInput.value.trim();
                const name = this.nameInput.value.trim().toUpperCase();
                const amount = parseInt(this.amountInput.value.trim());
                const description = this.descriptionInput.value.trim() || 'Thanh toan';
                this.currentPayment = { phone, name, amount, description };

                // Momo QR format: 2|99|PHONE|NAME|0|0|AMOUNT|DESCRIPTION|transfer_myqr
                const cleanDesc = description.replace(/[|]/g, ' ');
                const qrContent = `2|99|${phone}|${name}|0|0|${amount}|${cleanDesc}|transfer_myqr`;

                this.qrCodeContainer.innerHTML = '';
                this.qrCodeInstance = new QRCode(this.qrCodeContainer, {
                    text: qrContent,
                    width: 200,
                    height: 200,
                    colorDark: '#a50064',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });

                this.displayName.textContent = name;
                this.displayPhone.textContent = phone.replace(/(\d{4})(\d{3})(\d{3})/, '$1 $2 $3');
                this.displayAmount.textContent = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
                this.displayDescription.textContent = description;
                this.resetStatus();
                this.paymentForm.classList.add('hidden');
                this.qrSection.classList.remove('hidden');
                console.log('QR Content:', qrContent);
            }

            resetStatus() {
                this.statusIndicator.className = 'status-indicator';
                this.statusIndicator.innerHTML = `<div class="status-icon pending">⏳</div><span class="status-text">Đang chờ thanh toán...</span>`;
            }

            simulateSuccess() {
                this.statusIndicator.className = 'status-indicator success';
                this.statusIndicator.innerHTML = `<div class="status-icon">✓</div><span class="status-text">Thanh toán thành công!</span>`;
                this.successAmount.textContent = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(this.currentPayment.amount);
                this.successDesc.textContent = this.currentPayment.description;
                this.successModal.classList.remove('hidden');
            }

            simulateFailed() {
                this.statusIndicator.className = 'status-indicator failed';
                this.statusIndicator.innerHTML = `<div class="status-icon">✗</div><span class="status-text">Thanh toán thất bại!</span>`;
                this.failedModal.classList.remove('hidden');
            }

            closeModal(type) {
                if (type === 'success') this.successModal.classList.add('hidden');
                else this.failedModal.classList.add('hidden');
            }

            resetForm() {
                this.phoneInput.value = '';
                this.nameInput.value = '';
                this.amountInput.value = '';
                this.descriptionInput.value = '';
                this.qrCodeContainer.innerHTML = '';
                this.qrCodeInstance = null;
                this.currentPayment = null;
                this.resetStatus();
                this.qrSection.classList.add('hidden');
                this.paymentForm.classList.remove('hidden');
                this.phoneInput.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.momoPayment = new MomoPayment();
        });
    </script>
</body>
</html>
